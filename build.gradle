// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:6.9.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
    }
}
